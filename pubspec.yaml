name: koreaislam
description: A Flutter application for Korean Islam organization.
publish_to: 'none'

version: 1.0.3+1003

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^8.0.0
  cached_network_image: ^3.3.0
  carousel_slider: ^5.0.0
  currency_text_input_formatter: ^2.1.8
  characters: ^1.3.0
  device_info_plus: ^11.2.2
  dio: ^5.3.2
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  easy_localization: ^3.0.7
  elegant_notification: ^1.11.0
  equatable: ^2.0.5
  firebase_analytics: ^11.0.1
  firebase_core: ^3.1.0
  firebase_crashlytics: ^4.0.1
  firebase_remote_config: ^5.5.0
  firebase_messaging: ^15.1.0
  floor: ^1.4.2
  flutter_bloc: ^8.1.3
  flutter_cache_manager: ^3.3.1
  adhan_dart: ^1.2.0
  flutter_compass: ^0.8.1
  flutter_image_compress: ^2.1.0
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  flutter_native_splash: ^2.3.0
  flutter_svg: ^2.0.7
  freezed_annotation: ^2.4.1
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  get_it: ^7.6.0
  image_picker: ^0.8.7+5
  injectable: ^2.4.0
  infinite_scroll_pagination: ^4.0.0
  json_annotation: ^4.8.1
  light_compressor: ^2.1.0
  logger: ^2.0.1
  mask_text_input_formatter: ^2.5.0
  modal_bottom_sheet: ^3.0.0
  package_info_plus: ^8.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.3.1
  photo_view: ^0.14.0
  pretty_dio_logger: ^1.3.1
  rx_shared_preferences: ^4.0.0
  smart_auth: ^2.0.0
  smooth_page_indicator: ^1.1.0
  sqflite: ^2.3.3+1
  store_checker: ^1.6.0
  share_plus: ^12.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.6
  uuid: ^4.1.0
  auto_start_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^8.0.0
  chucker_flutter: ^1.9.0
  build_runner: any
  easy_localization_generator: ^0.3.2
  floor_generator: ^1.5.0
  flutter_gen_runner: ^5.3.1
  flutter_lints: ^2.0.0
  freezed: ^2.4.1
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1

flutter_native_splash:
  color: "#027537"
  color_dark: "#027537"
  image_android: assets/images/splash_logo_android.png
  image_ios: assets/images/splash_logo_ios.png
  branding_mode: bottom
  branding_bottom_padding: 24
  android_12:
    image: assets/images/splash_logo_android_12.png
  android: true
  ios: true
  web: false


dependency_overrides:
  intl: 0.19.0

flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/amiri_quran_regular.ttf
          weight: 400
  uses-material-design: true

  assets:
    - assets/localization/
    - assets/images/

flutter_gen:
  output: lib/core/gen/assets/
  integrations:
    flutter_svg: true